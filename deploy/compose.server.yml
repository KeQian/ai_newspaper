name: ai-newspaper
services:
  db:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_newspaper
      POSTGRES_USER: ai_newspaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ai_newspaper -d ai_newspaper']
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: ai-newspaper:${IMAGE_TAG:?required}
    restart: unless-stopped
    env_file: .env.server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ai_newspaper:${POSTGRES_PASSWORD}@db:5432/ai_newspaper
      ENABLE_DEV_AUTH: 'false'
      RAW_ARCHIVE_DIR: /var/lib/ai-newspaper/raw-archives
      CANDIDATE_RESPONSE_DIR: /var/lib/ai-newspaper/candidate-responses
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./runtime/raw-archives:/var/lib/ai-newspaper/raw-archives
      - ./runtime/candidate-responses:/var/lib/ai-newspaper/candidate-responses
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ['127.0.0.1:3100:8080']
    volumes:
      - ./server-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: [no-new-privileges:true]
    networks:
      default: {}
      entrypoint:
        aliases: [ai-newspaper-gateway]
networks:
  entrypoint:
    external: true
    name: interview_app_network
volumes:
  database:
