server {
    listen 8080;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(admin|newsletter|api/v1/(admin|internal|newsletter|webhooks))(/|$) {
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>功能尚未启用</title><h1>功能尚未启用</h1><p>站点已部署。管理员认证和邮件服务配置完成后开放此功能。</p><a href="/">返回首页</a></html>';
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
