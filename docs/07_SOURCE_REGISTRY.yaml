restricted_sources:
  - { id: product-hunt, reason: commercial API use requires permission }
  - { id: reddit, reason: commercial use may require a separate agreement }
  - { id: login_walled_social, reason: "do not bypass login, anti-bot, or access controls" }
notes:
  - Replace contact@example.com before any production request.
  - Add exact company repositories, SEC CIK values, domestic official sources, and parser fixtures before enabling those sources.
  - A source with terms_status review_before_launch must remain disabled in production until approved.
  - GitHub Releases, Hugging Face Models, and arXiv Atom connector implementations have fixture, request-policy, cursor, archive, and batch-isolation coverage; disabled sources remain disabled until terms review and launch configuration are complete.
