version: 1
defaults:
  timezone: Asia/Shanghai
  user_agent: AI-Signal-Research/0.1 (+contact@example.com)
  respect_robots: true
  max_document_bytes: 2097152
  request_timeout_seconds: 20
  retry: { attempts: 3, strategy: exponential, max_delay_seconds: 300 }
sources:
  - id: github-openai-python-releases
    name: OpenAI Python SDK Releases
    organization: OpenAI
    category: developer_ecosystem
    source_type: github
    reliability: s0
    endpoint: https://api.github.com/repos/openai/openai-python/releases
    parser: github_releases_v1
    schedule: hourly
    auth_env: GITHUB_TOKEN
    retention: metadata_and_excerpt
    terms_status: approved_api
    publication_policy: candidate_only
    enabled: true
    owner: editorial
